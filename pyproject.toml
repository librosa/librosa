[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "librosa"
description = "Python module for audio and music processing"
readme = "README.md"
requires-python = ">=3.13"
license = "ISC"
authors = [
    {name = "Brian McFee", email = "brian.mcfee@nyu.edu"},
    {name = "librosa development team"},
]
classifiers = [
    "Programming Language :: Python",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Framework :: Matplotlib",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dynamic = ["version"]
dependencies = [
    "numba>=0.61.0",
    "numpy>=2.3.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.7.0",
    "joblib>=1.5.0",
    "decorator>=5.2.1",
    "soundfile>=0.13.0",
    "pooch>=1.9.0",
    "soxr>=1.0.0",
    "lazy_loader>=0.5",
    "msgpack>=1.1.1",
]

[project.urls]
Homepage = "https://librosa.org"
Documentation = "https://librosa.org/doc"
Download = "https://github.com/librosa/librosa/releases"
Source = "https://github.com/librosa/librosa"
Tracker = "https://github.com/librosa/librosa/issues"
"Discussion forum" = "https://groups.google.com/g/librosa"

[project.optional-dependencies]
display = [
    "matplotlib>=3.11.0",
]
tests = [
    "librosa[display]",
    "pytest>=9.0.0",
    "pytest-mpl>=0.18.0",
    "pytest-cov>=6.1.0",
    "coverage>=7.6.5",
    "resampy>=0.4.3",
    "samplerate>=0.2.4; platform_machine != 'ARM64'",
    "scipy-stubs>=1.14.1.3",
]
docs = [
    "librosa[display]",
    "numpydoc>=1.9.0",
    "sphinx>=8.2.0",
    "pydata-sphinx-theme>=0.18.0",
    "sphinx-gallery>=0.19.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "myst-parser>=4.0.1",
    "ipython>=8.32.0",
    "resampy>=0.4.3",
    "umap-learn>=0.5.8",
    "pandas>=2.3.0",
    "presets>=1.0.0",
    "mir-eval>=0.8.0",
    "sphinxcontrib-svg2pdfconverter>=1.3.0",
    "sphinxcontrib-googleanalytics>=0.5",
    "sphinxcontrib-mermaid>=1.0.0",
    "sounddevice>=0.4.0",
]

[dependency-groups]
lint = [
    "codespell>=2.4.0",
    "types-decorator>=5.1.8.20250121",
    "mypy>=1.14.0",
    "ruff>=0.7.3",
    "numpydoc>=1.9.0",
    "sphinx>=8.2.0",
    "scipy-stubs>=1.14.1.3",
    "numpy>=2.3.0",
    "matplotlib>=3.11.0",
    "pytest>=9.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "librosa.version.version"}

[tool.setuptools.packages.find]
where = ["."]
include = ["librosa*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
librosa = [
    "util/example_data/*",
    "py.typed",
    "core/intervals.msgpack",
]

[tool.pytest.ini_options]
xfail_strict = true
addopts = "--mpl --mpl-baseline-path=tests/baseline_images/test_display"
filterwarnings = [
    "ignore::DeprecationWarning:resampy.*",
    "ignore:invalid value encountered in cast:RuntimeWarning:numba.*",
]

[tool.coverage.run]
relative_files = true
source = ["librosa"]

[tool.coverage.report]
omit = [
    "*/python?.?/*",
]
exclude_lines = [
    "@numba.jit",
    "@jit",
    "@numba.stencil",
    "@numba.guvectorize",
    "@numba.vectorize",
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.mypy]
check_untyped_defs = true
allow_redefinition = true
follow_imports = "silent"
strict = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = [
    "soundfile.*",
    "sklearn.*",
    "numba.*",
    "joblib.*",
    "pooch.*",
    "lazy_loader.*",
    "soxr.*",
    "msgpack.*",
    "packaging.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 119
extend-exclude = [
    "docs/_build",
    "docs/auto_*",
    "docs/api/generated",
    "docs/generated",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = [
    "E", "F", "S", "D", "W", "I", "PYI", "Q", "B", "SIM", "RUF", "TC", "NPY", "ARG",
    "UP",    # pyupgrade (Python 3.13+ syntax)
    "C4",    # flake8-comprehensions
    "PERF",  # perflint
    "FLY",   # flynt f-strings
    "PIE",   # flake8-pie
]
ignore = [
    "D107",  # This only affects inherited classes for us
    "D203",  # Blank line before class docstring is silly
    "D205",  # Blank line after summary is silly
    "D212",  # Multi-line docstring summary is unnecessary
    "D213",  # Multi-line docstring summary should end with a period, but we don't care
    "D400",  # First line should end with a period, but we don't care
    "D402",  # Docstring should not be a reST directive, but we don't care
    "D413",  # Missing blank line after last section is actually more readable in our codebase
    "D415",  # First line punctuation is not that important
    "D416",  # Section name colon is not compatible with numpydoc
    "D417",  # Missing argument descriptions are okay sometimes
    "S101",  # Sometimes we need asserts for type checking to work
    "SIM108",  # Ternary operators are bad for readability
    "SIM300",  # Yoda condition is different in numpy vectorized code
    "RUF022",  # We actually like having control over __all__ ordering
    "C408",    # We allow dict(k=v) for readability in parameter passing
    "PERF402", # List append loop is fine
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/__init__.pyi" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["librosa.util.deprecation.Deprecated"]

[tool.numpydoc_validation]
checks = [
    "all",
    "ES01", # No extended summary
    "EX01", # No examples section
    "SA01", # No See Also section
    "SA02", # Punctuation in See Also section is not that important
    "GL01", # Docstring starting on the same line as open quotes?
    "PR08", # Capitalization of parameter descriptions is not that important
    "PR09", # Punctuation of parameter descriptions is not that important
    "RT02", # It's useful to include shape descriptions in return types
    "SA04", # See Also descriptions are not that important
    "RT04", # Capitalization in return descriptions is not that important
    "RT05", # Punctuation in return descriptions is not that important
    "SS03", # Punctuation in summary is not that important
    "GL08", # @overload stubs and internal helpers do not need docstrings
    "SS01", # Module-level docstrings use autosummary format, not numpydoc
    "PR02", # We can have extra parameter names included, eg when using **kwargs
]
exclude = [
    # Exclude module-level docstrings (autosummary format, not numpydoc):
    "^[^.]+$",
    # Exclude all private functions and classes (those beginning with _):
    "\\._",
]
exclude_files = [
    '.*/__init__.py',
    '.*/version.py',
    '.*/_typing.py',
    '.*/_cache.py',
]

[tool.ruff.lint.extend-per-file-ignores]
"docs/**/*.py" = [
    "E402",  # Allow imports in the middle of the file
    "E501",  # Ignore line length
    "I",     # Disable isort to maintain your custom pedagogical import ordering
    "B018",  # Allow "useless expressions" (necessary for Sphinx-Gallery to render repr outputs)
    "D",     # Disable strict pydocstyle checks for tutorial scripts
]
"tests/**/*.py" = [
    "D",     # Disable strict pydocstyle checks for unit tests
]
