name: Build Release Asset

on:
  release:
    types: 
      - published

jobs:
  build-asset:
    name: "Build and attach docs zip"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Micromamba (Python + ffmpeg)
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-name: docs
          create-args: >-
            python=3.12
            ffmpeg
          cache-downloads: true

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install librosa and doc dependencies
        shell: bash -el {0}
        run: |
          uv pip install --prefix "$CONDA_PREFIX" -e ".[docs]"
          micromamba info
          uv pip list --prefix "$CONDA_PREFIX"

      - name: Build documentations
        shell: bash -el {0}
        run: sphinx-build -b html -d build/doctrees docs build/html

      - name: Zip and Upload Release Asset
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/html
          zip -q -r ../../librosa-docs.zip .
          cd ../../
          gh release upload ${{ github.event.release.tag_name }} librosa-docs.zip --clobber
