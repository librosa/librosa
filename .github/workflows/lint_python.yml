name: lint_python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_python:
    name: "Lint and code analysis"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: lint
        create-args: >-
          python=3.12
        cache-downloads: true

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install lint dependencies
      shell: bash -el {0}
      run: |
        uv pip install --prefix "$CONDA_PREFIX" --group lint
        micromamba info
        uv pip list --prefix "$CONDA_PREFIX"

    - name: Spell check
      shell: bash -el {0}
      run: codespell --ignore-words-list="ba,trough,ue" --skip="*demo.ipynb,./AUTHORS.md,./docs/changelog.rst"

    - name: Linting check
      shell: bash -el {0}
      run: ruff check --output-format=github librosa

    - name: Linting check on docs
      shell: bash -el {0}
      run: ruff check --output-format=github docs

    - name: Docstring formatting check  
      shell: bash -el {0}
      run: numpydoc lint librosa/*.py librosa/*/*.py
    
    - name: Type check package
      shell: bash -el {0}
      run: python -m mypy --pretty librosa
    
    - name: Type check tests
      shell: bash -el {0}
      run: python -m mypy --pretty tests
