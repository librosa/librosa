name: Docs

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Build Release Asset"]
    types:
      - completed

permissions: 
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc:
    name: "Documentation build"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Micromamba (Python + ffmpeg)
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-name: docs
          create-args: >-
            python=3.14
            ffmpeg
          cache-downloads: true

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install librosa and doc dependencies
        shell: bash -el {0}
        run: |
          uv pip install --prefix "$CONDA_PREFIX" -e ".[docs]"
          micromamba info
          uv pip list --prefix "$CONDA_PREFIX"

      - name : Pull historical documentation assets
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONS=$(gh release list -L 100 -O asc --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')

          PUSHED_VERSIONS=""
          for ver in $VERSIONS; do
            echo "Fetching docs for $ver"
            mkdir -p "build/html/$ver"
            if gh release download "$ver" --pattern "librosa-docs.zip" --dir "temp_dl"; then
              unzip -q "temp_dl/librosa-docs.zip" -d "build/html/$ver"
              rm -rf temp_dl
              LATEST=$ver
              PUSHED_VERSIONS="$ver $PUSHED_VERSIONS"
            else
              echo "No docs found for $ver; skipping."
              rmdir "build/html/$ver"
            fi
          done
          ln -srf build/html/$LATEST build/html/latest
          ln -srf build/html/dev build/html/main
          python docs/create_version_json.py --preferred $LATEST dev $PUSHED_VERSIONS

      - name: Build documentations
        shell: bash -el {0}
        run: |
          sphinx-build -j auto -b html -d build/doctrees docs build/html/dev
          cp docs/docsite-index-redirect.html build/html/index.html


      - name: Push to web
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          personal_token: ${{ secrets.DOC_PUBLISH_TOKEN }}
          external_repository: librosa/doc
          enable_jekyll: false
          publish_branch: main
          publish_dir: build/html
          user_name: librosa
          user_email: brian.mcfee@nyu.edu
          force_orphan: true
