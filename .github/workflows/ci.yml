name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: True

env:
    # Channel that provides native win-arm64 conda packages
    WIN_ARM64_CONDA_CHANNEL: bootstrap-win-arm64-round-2-native

jobs:
    test:
        name: >-
          Python ${{ matrix.python-version }} on ${{ matrix.os }}
          ${{ matrix.variant && format(' - {0}', matrix.variant) || '' }}
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: "3.12"
                      variant: "minimal"

                    - os: ubuntu-latest
                      python-version: "3.12"

                    - os: ubuntu-latest
                      python-version: "3.13"

                    - os: ubuntu-24.04-arm
                      python-version: "3.14"

                    - os: ubuntu-latest
                      python-version: "3.14"

                    - os: macos-latest
                      python-version: "3.14"

                    - os: windows-latest
                      python-version: "3.14"

                    - os: windows-11-arm
                      python-version: "3.14"
                      win_arm64: true
        steps:
        - uses: actions/checkout@v7

        - name: Create short temp directory (Windows only)
          if: runner.os == 'Windows'
          run: mkdir C:\tmp
          shell: cmd

        - name: Set environment variables (Windows only)
          if: runner.os == 'Windows'
          run: |
            echo "TMP=C:\tmp" >> $env:GITHUB_ENV
            echo "TEMP=C:\tmp" >> $env:GITHUB_ENV
          shell: pwsh

        - name: Setup Micromamba
          uses: mamba-org/setup-micromamba@v3
          with:
            environment-name: test
            condarc: |
              channels:
                - ${{ matrix.win_arm64 && env.WIN_ARM64_CONDA_CHANNEL || 'conda-forge' }}
                - conda-forge
                ${{ matrix.win_arm64 && '- defaults' || '' }}
            create-args: >-
              python=${{ matrix.python-version }}
              ffmpeg
              libsndfile
              ${{ matrix.win_arm64 && 'soxr-python' || '' }}
            cache-downloads: true

        - name: Setup uv
          uses: astral-sh/setup-uv@v10.3.3
          with:
            enable-cache: true
            cache-dependency-glob: "pyproject.toml"

        - name: Install librosa and test dependencies
          shell: bash -el {0}
          run: |
            if [ "${{ matrix.variant }}" == "minimal" ]; then
              uv pip install --prefix "$CONDA_PREFIX" --resolution=lowest-direct -e ".[tests]"
            else
              uv pip install --prefix "$CONDA_PREFIX" --upgrade -e ".[tests]"
            fi

        - name: Environment info
          shell: bash -el {0}
          run: |
            micromamba info
            uv pip list --prefix "$CONDA_PREFIX"
            python -c "import scipy; scipy.show_config()"

        - name: Run pytest
          shell: bash -el {0}
          run: pytest --mpl-results-path=mpl_image_results/

        - name: Prepare artifact directory structure
          if: failure() && hashFiles('mpl_image_results/**') != ''
          id: prep_artifact
          run: |
            PR_NUM="${{ github.event.pull_request.number || github.run_id }}"
            ART_NAME="mpl-test-results-${{ runner.os }}--${{ runner.arch }}--${{ matrix.python-version }}-PR${PR_NUM}"
            
            mkdir -p "_artifact_stage/$ART_NAME"
            mv mpl_image_results/* "_artifact_stage/$ART_NAME/"
          
            echo "art_name=$ART_NAME" >> "$GITHUB_OUTPUT"

        - name: Upload image comparison failures if any
          if: failure() && steps.prep_artifact.outputs.art_name != ''
          uses: actions/upload-artifact@v7
          with:
            name: ${{ steps.prep_artifact.outputs.art_name }}
            path: _artifact_stage/
            retention-days: 7
            compression-level: 0
            overwrite: true


        - name: Upload coverage to Codecov
          uses: codecov/codecov-action@v7
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            files: ./coverage.xml
            flags: unittests
            env_vars: OS,PYTHON
            name: codecov-umbrella
            fail_ci_if_error: true
            verbose: true
