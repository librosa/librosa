name: CI Docs

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions: 
  contents: read
  
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: True


env:
  LIBROSA_DOC_DEBUG: True  # Disable docstring example execution

jobs:
    setup:
        name: "Doc environment setup"
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
            fetch-depth: 0

        - name: Setup Micromamba (Python + ffmpeg)
          uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
          with:
            environment-name: docs
            create-args: >-
              python=3.14
              ffmpeg
            cache-downloads: true

        - name: Setup uv
          uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
          with:
            enable-cache: true
            cache-dependency-glob: "pyproject.toml"

        - name: Install librosa and doc dependencies
          shell: bash -el {0}
          run: |
            uv pip install --prefix "$CONDA_PREFIX" -e ".[docs]"
            micromamba info
            uv pip list --prefix "$CONDA_PREFIX"

        - name: Build documentation site
          shell: bash -el {0}
          run: |
            sphinx-build -j auto -b html -d build/doctrees docs build/html
            touch build/html/.nojekyll

        - name: Upload compiled documentation site
          if: github.event_name == 'pull_request'
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
          with:
            name: librosa-docs-pr-${{ github.event.pull_request.number }}
            path: build/html
            retention-days: 7
            overwrite: true
            include-hidden-files: true

        - name: Link checking
          id: linkcheck
          shell: bash -el {0}
          working-directory: docs
          run: make linkcheck
          continue-on-error: true

        - name: Save linkcheck status
          run: echo "${{ steps.linkcheck.outcome }}" > status.txt

        - name: Save linkcheck output
          run: cp docs/_build/linkcheck/output.txt output.txt || touch output.txt

        - name: Save PR number
          if: github.event_name == 'pull_request'
          run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

        - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
          with:
            name: linkcheck-results
            path: |
              status.txt
              output.txt
              pr_number.txt

        - name: Warn on linkcheck failure
          if: steps.linkcheck.outcome == 'failure'
          run: |
            OUTPUT=$(cat docs/_build/linkcheck/output.txt)
            echo "::warning Linkcheck failed: $OUTPUT"

        - name: Check for broken symbolic links
          shell: bash -el {0}
          run: |
            if [[ -n "$(find build/html/ -type l ! -exec test -e {} \; -print -quit)" ]]; then false; fi
